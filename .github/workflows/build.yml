name: Build and Release

on: [push, pull_request]

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  BUILD_TYPE: Release

jobs:
  get-info:
    runs-on: ubuntu-24.04
    outputs:
      date: ${{ steps.vars.outputs.date }}
      shorthash: ${{ steps.vars.outputs.shorthash }}
    steps:
      - uses: actions/checkout@v4
      - name: Get date and git hash
        id: vars
        run: |
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "shorthash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

  linux:
    runs-on: ubuntu-24.04
    needs: get-info
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          mkdir upload
          cp build/pkg_extractor extractor/*.sh extractor/readme_linux.txt upload/
          chmod +x upload/*
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: kytyps5plus-pkg-extractor-linux-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}
          path: upload/

  linux-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build with ASan + UBSan
        run: |
          g++ -std=c++20 -g -O1 -fsanitize=address,undefined -fno-sanitize-recover=undefined \
            -Isrc extractor/main.cpp src/pkg.cpp src/psf.cpp -o pkg_extractor_san
      - name: Test under sanitizers
        run: python3 tests/run_tests.py ./pkg_extractor_san

  windows:
    runs-on: windows-2025
    needs: get-info
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel
      - name: Test
        run: ctest --test-dir build -C ${{ env.BUILD_TYPE }} --output-on-failure
      - name: Package
        shell: pwsh
        run: |
          mkdir upload
          copy build/${{ env.BUILD_TYPE }}/pkg_extractor.exe upload/
          copy extractor/*.bat, extractor/readme_windows.txt upload/
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: kytyps5plus-pkg-extractor-win64-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}
          path: upload/
